services:
  gmail-push:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATA_FILE: /data/registrations.json
      PUSH_SHARED_SECRET: ${PUSH_SHARED_SECRET:?set PUSH_SHARED_SECRET}
      PUBSUB_AUDIENCE: ${PUBSUB_AUDIENCE:-}
      WATCH_RENEW_MS: "3600000"
    volumes:
      - gmail_push_data:/data

volumes:
  gmail_push_data:
